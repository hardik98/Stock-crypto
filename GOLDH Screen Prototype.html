<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLDH Screen Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the shipped GOLDH app — same tokens, type and layouts as develop (AppLayout, PageHeader, CioCommandCenter, CatalystFeed, InsightDecisionCard, WhaleHero).
   IDEA: a faithful click-through of the planned build: existing screens kept, new blocks added in the same visual language.
   PICTURE: HOME's four US tracker charts and each module's hero frame.
   COLOUR and TYPE: #050505 page, #0a0a0a cards, #1a1a1a/#222 borders, #DDD5C3 text, gold #C7AE6A; Inter + JetBrains Mono, uppercase tracked micro-labels as in the app.
   LAYOUT: left sidebar and 56px header on desktop, bottom tab bar on phones; content max 1600px like Pulse and Catalyst. */
:root{color-scheme:dark;--bg:#050505;--card:#0a0a0a;--card2:#111;--b1:#1a1a1a;--b2:#222;--b3:#1f1f1f;--ink:#DDD5C3;--white:#fff;--m:#8b8b8b;--q:#6b6b6b;--f:#4a4a4a;--g6:#4b5563;--g5:#6b7280;--g4:#9ca3af;--g3:#d1d5db;--gold:#C7AE6A;--gold2:#E5D5A5;--em:#34d399;--em5:#10b981;--ro:#fb7185;--red:#ef4444;--amb:#fbbf24;--blue:#3b82f6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#d1d5db;font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--em)}.down{color:var(--ro)}
.lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;color:#fff}
.mlbl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--m)}
.tiny{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--g6)}
.gl{display:flex;align-items:center;gap:12px}.gl::before{content:"";width:16px;height:1px;background:var(--gold);flex:none}
.shell{display:flex;height:100vh;overflow:hidden}
aside.side{width:256px;flex:none;background:#0a0a0a;border-right:1px solid var(--b1);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand .g{width:32px;height:32px;border-radius:4px;background:var(--gold);color:#000;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.brand .w{font-weight:900;letter-spacing:.18em;color:#fff;font-size:15px}
.nsec{margin-bottom:22px}
.nsec h4{margin:0 0 8px;padding:0 12px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--g6)}
.ni{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--g5);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.ni svg{width:16px;height:16px;flex:none}
.ni:hover{color:#e5e7eb;background:rgba(199,174,106,.05)}
.ni.on{color:#fff;background:rgba(199,174,106,.08)}.ni.on svg{color:var(--gold)}
.ni.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:4px;height:16px;background:var(--gold);border-radius:4px 0 0 4px;box-shadow:0 0 8px rgba(199,174,106,.6)}
.ni.dim{opacity:.45;cursor:default}
.sidefoot{margin-top:auto}
main.mainc{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
header.hd{height:56px;flex:none;border-bottom:1px solid var(--b1);background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.crumbs{font-size:11px;color:var(--g5);display:flex;gap:6px;align-items:center}.crumbs b{color:var(--g3)}
.hdr{display:flex;align-items:center;gap:10px}
.proto{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
select.sm{height:32px;background:#111;border:1px solid var(--b2);border-radius:8px;padding:0 8px;font-size:12px;color:#e5e7eb}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(45deg,var(--gold),var(--gold2));color:#000;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.bell{color:var(--g4);display:flex}.bell svg{width:18px;height:18px}
.scrollarea{flex:1;overflow-y:auto;background:var(--bg)}
.devstrip{background:rgba(199,174,106,.08);border-bottom:1px solid rgba(199,174,106,.2);color:var(--gold2);font-size:11px;text-align:center;padding:6px 16px}
.page{max-width:1600px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:1152px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph .t{display:flex;align-items:center;gap:12px}.ph .t svg{width:32px;height:32px;color:var(--gold)}
.ph h1{margin:0;font-size:28px;font-weight:700;line-height:1.15;color:#fff}
.ph h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ph p{margin:2px 0 0;color:var(--m);font-size:13px;font-weight:500}
.asof{font-size:10px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--em5);display:inline-block}
.sec{background:#0a0a0a;border:1px solid var(--b1);border-radius:16px;padding:20px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sech h3{margin:0;font-size:13px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.15em}
.sech p{margin:2px 0 0;font-size:10px;color:var(--g6)}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gold);font-weight:600;cursor:pointer}.lnk svg{width:12px;height:12px}
.frame{background:#0a0a0a;border:1px solid var(--b2);border-radius:12px;padding:14px;position:relative;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(30,58,138,.07),transparent 60%);pointer-events:none}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.f4>div{padding:8px 16px;display:flex;gap:16px;align-items:center;border-right:1px solid var(--b2)}
.f4>div:last-child{border-right:0}
.circ{width:48px;height:48px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;flex:none;background:#0a0a0a}
.circ svg{width:24px;height:24px}
.circ.red{border-color:rgba(239,68,68,.4);color:var(--red);box-shadow:0 0 30px rgba(239,68,68,.25)}
.circ.blue{border-color:rgba(59,130,246,.4);color:var(--blue);box-shadow:0 0 30px rgba(59,130,246,.25)}
.circ.zinc{border-color:#27272a;color:#a1a1aa}
.big{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;line-height:1;margin-bottom:6px}
.sm12{font-size:12px;color:var(--ink);line-height:1.4}
.hr{height:1px;background:var(--b2);margin:12px 16px;position:relative}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.mini{display:flex;align-items:center;gap:12px;padding:4px 16px;border-right:1px solid var(--b2)}.mini:last-child{border-right:0}
.mini .ib{background:#111;padding:8px;border-radius:6px;display:flex}.mini .ib svg{width:16px;height:16px}
.mini b{display:block;font-size:12px;color:var(--ink)}.mini span{font-size:11px;color:var(--q)}
.vbar{position:relative;height:8px;background:#1a1a1a;border-radius:99px;overflow:hidden;margin:6px 0}
.vbar i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--em5),var(--amb),var(--red))}
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g12{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
.hero{background:linear-gradient(90deg,rgba(199,174,106,.10),#0a0a0a 45%,#0a0a0a);border:1px solid rgba(199,174,106,.3);border-radius:16px;padding:28px;position:relative;overflow:hidden}
.hero h2{margin:12px 0 8px;font-size:26px;font-weight:700;color:#fff;line-height:1.2;text-wrap:balance}
.hero p{margin:0;color:var(--g4);font-size:15px;line-height:1.6;max-width:860px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
.chip.dn{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171}.chip.upc{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:var(--em)}
.ev-chip{display:inline-flex;gap:6px;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid}
.recap{margin-left:4px;font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.1em;padding:2px 6px;background:rgba(199,174,106,.1);border:1px solid rgba(199,174,106,.3);border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:14px;margin-top:16px;border-top:1px solid var(--b1)}
.stats .v{font-size:18px;font-weight:700;font-family:"JetBrains Mono",monospace}
.charts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chart{background:#0a0a0a;border:1px solid var(--b3);border-radius:12px;padding:12px}
.chart:hover{border-color:rgba(199,174,106,.2)}
.chart .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chart .nm{font-size:13px;font-weight:700;color:#fff}.chart .tk{font-size:10px;color:var(--g6);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.chart .px{font-size:18px;font-weight:700;color:#fff}
.chart svg{width:100%;height:auto;display:block;margin-top:6px}
.chart .ft{display:flex;justify-content:space-between;font-size:10px;color:var(--g6);margin-top:4px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st.live{color:var(--em);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.st.delayed{color:#93c5fd;border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)}
.st.stale{color:var(--amb);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.st.unavailable{color:#f87171;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.st.mock{color:var(--g4);border-color:#333;background:#111}
.acard{background:#0a0a0a;border:1px solid var(--b1);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px}
.acard:hover{border-color:rgba(199,174,106,.2)}
.acard .s{font-size:13px;font-weight:700;color:#fff;font-family:"JetBrains Mono",monospace}.acard .n{font-size:10px;color:var(--g6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .p{font-size:13px;font-weight:600;color:#e5e7eb}.acard .c{font-size:12px;font-weight:700}
.sector{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sector div{border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.04)}
.sector small{display:block;font-weight:600;font-size:10px;opacity:.8}
.gcard{background:#0a0a0a;border:1px solid var(--b3);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gcard:hover{border-color:rgba(199,174,106,.3)}
.av{width:36px;height:36px;border-radius:12px;background:#111;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;flex:none}.av svg{width:18px;height:18px}
.tm{font-size:10px;color:var(--g6);font-weight:700;background:#111;padding:4px 8px;border-radius:6px;border:1px solid var(--b2);white-space:nowrap}
.bdg{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.bdg.bull{color:var(--em);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}.bdg.bear{color:var(--ro);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.08)}.bdg.neu{color:var(--g4);border-color:#333;background:#111}.bdg.gold{color:var(--gold);border-color:rgba(199,174,106,.3);background:rgba(199,174,106,.08)}
.quote{font-size:13px;color:var(--g4);font-style:italic;line-height:1.6;margin:0}
.ccard{background:#0a0a0a;border:1px solid var(--b3);border-radius:12px;padding:14px}
.impact{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid}
.impact.High{color:#f87171;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}.impact.Medium{color:var(--amb);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}.impact.Low{color:var(--g4);background:#111;border-color:#333}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--q);text-align:left;padding:10px 12px;border-bottom:1px solid var(--b2);white-space:nowrap}
.tbl td{font-size:11px;padding:10px 12px;border-bottom:1px solid rgba(34,34,34,.6);vertical-align:middle}
.tbl tr:hover td{background:#121212}
.tbl .r{text-align:right}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--b2);padding:0 20px;overflow-x:auto}
.tab{padding:12px 0;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:var(--q);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.widget{background:rgba(17,17,17,.4);border:1px solid var(--b2);border-radius:12px;padding:16px}
.pbk{border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#0a0a0a;overflow:hidden}
.pbk .row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid rgba(255,255,255,.05);font-size:11px;color:var(--ink);font-weight:500}
.pbk .row svg{width:14px;height:14px;color:var(--gold);flex:none}
.pbk .row .k{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;width:64px;flex:none}
.insight{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:12px;background:#0a0a0a;border:1px solid var(--b2)}
.insight .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(199,174,106,.15);border:1px solid rgba(199,174,106,.3);color:var(--gold);flex:none}.insight .ic svg{width:14px;height:14px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(199,174,106,.3);background:transparent;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(199,174,106,.1)}
.btn.solid{background:var(--gold);color:#000;border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.inp{height:34px;background:#111;border:1px solid var(--b2);border-radius:8px;padding:0 10px;font-size:12px;color:#fff;width:100%}
.inp:focus,select.sm:focus,.btn:focus-visible,.tab:focus-visible,.ni:focus-visible,.pill:focus-visible{outline:1px solid rgba(199,174,106,.6);outline-offset:1px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--b2);background:#111;font-size:11px;font-weight:700;color:var(--g4);cursor:pointer;white-space:nowrap}
.pill.on{color:var(--gold);border-color:rgba(199,174,106,.4);background:rgba(199,174,106,.08)}
.seg{display:inline-flex;background:#0a0a0a;border:1px solid var(--b2);border-radius:8px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--q);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.seg button.on{background:#1a1a1a;color:var(--gold)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.lock{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.1em}.lock svg{width:14px;height:14px}
.dcard{background:#0a0a0a;border:1px solid #18181b;border-radius:12px;overflow:hidden}
.dcard .rowg{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.3fr) 24px;gap:16px;align-items:center;padding:16px 20px;cursor:pointer}
.dcard:hover{border-color:#27272a}
.flag{width:32px;height:32px;border-radius:50%;border:1px solid #27272a;background:#18181b;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:var(--gold);flex:none}
.zl{font-size:10px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:.08em}
.det{border-top:1px solid #18181b;background:rgba(10,10,10,.6);padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:12px}
.det .h{display:flex;align-items:center;gap:8px;color:#a1a1aa;font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.det .h svg{width:14px;height:14px;color:var(--gold)}
.det p{margin:0;color:#a1a1aa;font-style:italic;border-left:1px solid #27272a;padding-left:14px;line-height:1.6}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal span{font-size:11px;padding:6px 0;border-radius:6px;color:#a1a1aa;position:relative}
.cal .h{font-size:9px;font-weight:900;color:#52525b}
.cal .ev::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.cal .today{background:rgba(199,174,106,.15);color:var(--gold);font-weight:800}
.wrow{background:#0a0a0a;border:1px solid var(--b3);border-radius:12px;padding:16px 20px;display:flex;gap:18px;align-items:stretch}
.wrow .bar{width:4px;border-radius:99px;flex:none}
.foot{text-align:center;font-size:10px;color:var(--g6);font-weight:500;padding-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal .box{background:#0f0f0f;border:1px solid var(--b2);border-radius:16px;padding:22px;max-width:480px;width:100%}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#111;border:1px solid rgba(199,174,106,.4);color:#fff;padding:10px 16px;border-radius:10px;z-index:70;font-size:13px}
.meter{height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}.meter i.warn{background:var(--amb)}
.tabbar{display:none}
#app{overflow-x:clip}
.mt{margin-top:8px}.q{color:var(--q)}.m{color:var(--m)}.w{color:#fff}

function catalyst(){
  const consMock = statusOf('economic_events')==='mock', earnMock = statusOf('earnings_calendar')==='mock', free = !paid();
  let list = EVENTS.filter(e => S.cfilter==='week' ? e.t<NOW+7*864e5 && e.t>NOW-864e5 : S.cfilter==='high' ? e.band==='High' : S.cfilter==='watch' ? e.wl : true);
  if (free) list = EVENTS.filter(e=>e.band==='High'&&e.t>NOW).slice(0,5);
  const next = EVENTS.find(e=>e.t>NOW&&e.band==='High');
  const row = e => { const i = EVENTS.indexOf(e), open = S.openEvent===i && !free, rel = e.act && e.t<=NOW, mock = e.kind==='earnings'?earnMock:consMock;

      <div><span class="impact ${e.band}">${e.band}</span>${free?'':`<div class="zl" style="font-size:9px;margin-top:4px" title="How much this event can move markets, 0 to 100">Impact <span class="mono" style="color:#d4d4d8">${e.score}/100</span></div>`}</div>
      ${free?'<div></div><div></div>':`<div class="mono" style="font-size:11px;color:#a1a1aa">Last ${esc(e.prev)}<br>Expected ${esc(e.cons)}${mock?'<div style="margin-top:4px">'+st('mock')+'</div>':''}</div>
      <div>${rel?`<div style="display:flex;align-items:center;gap:6px;font-weight:700;color:#fff" class="mono">${ic('check').replace('<svg','<svg width="12" height="12" style="color:var(--em5)"')} Released ${esc(e.act)}</div><div class="zl" style="font-size:9px">${parseFloat(e.act)<parseFloat(e.cons)?'Below':'Above'} what was expected</div>`:`<span style="font-size:10px;color:#52525b;font-weight:700;font-style:italic">Awaiting release</span>`}</div>`}
      <span style="color:#52525b;display:flex">${ic('chev').replace('<svg','<svg width="16" height="16"'+(open?' style="transform:rotate(90deg)"':''))}</span></div>
      ${open?detail(e):''}</div>`; };
  const month = (() => { const days=[]; const start = Date.parse('2026-11-01T12:00:00Z'); const first = new Date(start).getUTCDay(); for(let i=0;i<(first+6)%7;i++) days.push('<span></span>'); for(let d=1; d<=30; d++){ const has = EVENTS.some(e=>new Date(e.t).getUTCMonth()===10 && new Date(e.t).getUTCDate()===d); days.push(`<span class="${d===20?'today':''} ${has?'ev':''}">${d}</span>`);} return days.join(''); })();
  return `<div class="page">

const REG = (() => { const m = new Map(); [...Object.values(ASSETS).flat(), ...EXTRA].forEach(r => { if (typeof r[2]==='number' && r[4]!=='fx' && !m.has(r[0])) m.set(r[0], {s:r[0], n:r[1], p:r[2], c:r[3], t:r[4], k: r[4]==='crypto'?'Crypto':ETFS.has(r[0])?'ETF':CRYPTO_EQ.has(r[0])?'Crypto stock':'Stock'}); }); return [...m.values()]; })();
const regOf = s => REG.find(r => r.s===s);

const tkMatch = q => { q = q.trim().toUpperCase(); if (!q) return REG.slice(0,12); const a = REG.filter(r => r.s.startsWith(q)), b = REG.filter(r => !r.s.startsWith(q) && (r.s.includes(q) || r.n.toUpperCase().includes(q))); return [...a, ...b].slice(0,8); };
function tickerPicker(id, sel, multi, label){
  return `<div class="tkp" data-tkp="${id}" data-multi="${multi?1:0}"><label class="tiny" for="${id}-in">${label}</label>
    <div class="tkbox">${sel.map(s => { const r = regOf(s); return `<span class="tkc"><b class="mono">${esc(s)}</b>${r?`<span>${esc(r.n)}</span>`:''}${multi?`<button type="button" data-tkrm="${esc(s)}" data-tkfor="${id}" aria-label="Remove ${esc(s)}">×</button>`:''}</span>`; }).join('')}
      ${multi && sel.length>=5 ? '<span class="q" style="font-size:11px">Maximum 5</span>' : `<input id="${id}-in" class="tkin" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="${id}-lb" autocomplete="off" placeholder="${multi?(sel.length?'Add another':'Search symbol or company'):(sel.length?'Change: search symbol or company':'Search symbol or company')}">`}</div>
    <ul class="tkl" id="${id}-lb" role="listbox" hidden></ul></div>`;

function tkRender(box, q){
  const lb = box.querySelector('.tkl'), inp = box.querySelector('.tkin'); const have = [...box.querySelectorAll('.tkc b')].map(x=>x.textContent); const L = tkMatch(q).filter(r => box.dataset.multi!=='1' || !have.includes(r.s)); box._opts = L; box._i = 0;
  lb.innerHTML = L.length ? L.map((r,i)=>`<li role="option" id="${box.dataset.tkp}-o${i}" data-tkpick="${r.s}" class="${i===0?'on':''}" aria-selected="${i===0}"><b class="mono">${r.s}</b><span class="tkn">${esc(r.n)}</span><span class="tkk">${r.k}</span><span class="mono tkpx">${fmt(r.p, r.p>=1000?0:2)}</span></li>`).join('') : '<li class="tkno">No match in the GOLDH symbol list (US Phase 1)</li>';
  lb.hidden = false; inp.setAttribute('aria-expanded','true'); if (L.length) inp.setAttribute('aria-activedescendant', `${box.dataset.tkp}-o0`);
}
function tkPick(box, s){
  const id = box.dataset.tkp;
  if (id==='bctk'){ const cur = S.draft.tickers.split(/[\s,]+/).filter(Boolean); if (!cur.includes(s) && cur.length<5) cur.push(s); S.draft.tickers = cur.join(', '); tkRefresh('bctk', cur, true, 'Tickers (up to 5)'); refreshComposer(); }
  else { const r = regOf(s); S.cd.tk = s; S.cd.cls = clsFor(r); render(); toast(`${s} · ${r.n} · asset class set to ${S.cd.cls}`); }
}
function tkRefresh(id, sel, multi, label){ const box = document.querySelector(`[data-tkp="${id}"]`); if (!box) return; box.outerHTML = tickerPicker(id, sel, multi, label); const inp = document.getElementById(id+'-in'); if (inp) inp.focus(); }
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('tkin')) tkRender(e.target.closest('.tkp'), e.target.value); });
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('tkin')) tkRender(e.target.closest('.tkp'), e.target.value); });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('tkin')) setTimeout(() => { const b = e.target.closest('.tkp'); if (b && !b.contains(document.activeElement)){ const lb=b.querySelector('.tkl'); if (lb) lb.hidden = true; e.target.setAttribute('aria-expanded','false'); } }, 120); });
document.addEventListener('keydown', e => {
  if (!(e.target.classList && e.target.classList.contains('tkin'))) return; const box = e.target.closest('.tkp'), L = box._opts || [];
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if (!L.length) return; box._i = (box._i + (e.key==='ArrowDown'?1:L.length-1)) % L.length; box.querySelectorAll('[data-tkpick]').forEach((li,i)=>{ li.classList.toggle('on', i===box._i); li.setAttribute('aria-selected', i===box._i); }); e.target.setAttribute('aria-activedescendant', `${box.dataset.tkp}-o${box._i}`); box.querySelector('.tkl li.on')?.scrollIntoView({block:'nearest'}); }
  else if (e.key==='Enter'){ e.preventDefault(); if (L[box._i]) tkPick(box, L[box._i].s); }
  else if (e.key==='Escape'){ box.querySelector('.tkl').hidden = true; e.stopPropagation(); }
  else if (e.key==='Backspace' && !e.target.value && box.dataset.multi==='1'){ const cur = S.draft.tickers.split(/[\s,]+/).filter(Boolean); cur.pop(); S.draft.tickers = cur.join(', '); tkRefresh('bctk', cur, true, 'Tickers (up to 5)'); refreshComposer(); }
}, true);
document.addEventListener('mousedown', e => { const li = e.target.closest('[data-tkpick]'); if (li){ e.preventDefault(); tkPick(li.closest('.tkp'), li.dataset.tkpick); } });

function cioCalc(d){
  const pr = priceOf(d.tk.toUpperCase()); const ref = d.override ? parseFloat(d.override) : pr ? pr.p : NaN; const [h,a,tr] = IOS[d.cls];
  return {pr, ref, stop: ref*(1-h/100), act: ref*(1+a/100), h, a, tr};
}
function cioChecks(d){
  const tk = d.tk.toUpperCase(), pos = openPos()[tk], c = cioCalc(d), m = d.why.match(/\b(must|guarantee[ds]?|sure thing|will (?:rise|fall|crash|soar|double)|can'?t lose|risk-free)\b/i);
  return [
    ['Ticker found in GOLDH prices', !!c.pr],
    [d.act==='new' ? (pos?`${tk} is already open at ${pos.k} of 3: use Add`:'Not already open') : d.act==='add' ? (pos?`Raises ${pos.k} of 3 → ${d.k} of 3`:'Add needs an open recommendation') : (pos?`Open at ${pos.k} of 3`:'Needs an open recommendation'),
      d.act==='new' ? !pos : d.act==='add' ? !!pos && d.k>pos.k : d.act==='trim' ? !!pos && d.k<pos.k && d.k>=1 : !!pos],
    ['At most 3 records per ticker (3 of 3 is the full position)', d.k<=3],

        <div class="tiny" style="margin:12px 0 6px">Free · no pop-up</div><div class="q" style="font-size:11px">Bell shows a weekly line: "The GOLDH CIO made 2 moves this week · Pro".</div>
        <div style="font-size:11px;color:var(--ink);margin-top:12px">Reaches <b class="w mono">${fmt(388+96,0)}</b> Pro and Elite subscribers at once · <b class="w mono">612</b> Essential teasers</div></div>
      <div class="widget"><div class="gl"><span class="lbl">Checks</span></div><ul class="ckl">${C.map(([t,v])=>`<li class="${v?'ok':'no'}"><b>${v?'✓':'×'}</b><span>${esc(t)}</span></li>`).join('')}</ul></div>
    </div>
  </div>
  <div class="frame" style="padding:0"><div style="padding:16px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="gl"><span class="lbl">CIO moves</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${['pro','essential','free'].map(p=>`<button class="btn" style="height:26px;font-size:9px" data-previewas="${p}">View as ${PN[p]}</button>`).join('')}</div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Move</th><th>Asset</th><th>Position</th><th class="r">Reference</th><th>Published</th><th>Source</th><th>Reach</th></tr></thead><tbody>
    ${S.cio.slice().sort((a,b)=>b.t-a.t).map(r=>`<tr><td><span class="sev live">${ACTL[r.act]}</span></td><td><b class="w mono">${esc(r.tk)}</b> <span class="q" style="font-size:11px">${esc(r.cls)}</span>${r.sample?' '+st('mock'):''}</td><td>${r.act==='close'?'closed':r.k+' of 3'}</td><td class="r mono">${fmt(r.ref, r.ref>=1000?0:2)}</td><td class="mono q" style="font-size:11px">${dt(r.t)} ${hm(r.t)}</td><td style="font-size:11px;color:var(--ink)">${esc(r.src)}</td><td style="font-size:11px">${r.reach?`<span class="mono w">${fmt(r.reach.d,0)}</span> sent · <span class="mono w">${r.reach.s}</span> opened`:'<span class="q">before alerts existed</span>'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="widget"><div class="gl"><span class="lbl">Why it works this way</span></div><div style="margin-top:10px;display:grid;gap:8px;font-size:12px;color:var(--ink);line-height:1.5">
    <div><b class="w">GOLDH wording, not "bought".</b> Subscribers see "New recommendation · NVDA · position 1 of 3" with a reference entry price, per the 30 Oct wording decision. It records a recommendation; it does not report a trade.</div>
    <div><b class="w">One record, everywhere.</b> Publishing writes the Alpha Portfolio record (with its source Brief) and the notification from the same data, so the pop-up and Portfolio Intelligence never disagree.</div>
    <div><b class="w">Personal trading rule.</b> Buying before recommending and selling into subscribers' buying is "scalping", which US courts treat as fraud on subscribers. The author confirms a blackout and discloses holdings. Counsel confirms the window.</div>
    <div><b class="w">Correction.</b> A wrong ticker or price is corrected by a new move with a note, never by editing the published one (closed records are frozen).</div></div></div>
  </div>`;
}

/* ---------- navigation, router, events ---------- */
const NAV = [['home','Home','home'],null,['pulse','GoldH Pulse','activity'],['guru','Guru Talk','msg'],['catalyst','Catalyst Intelligence','zap'],['whale','Whale Watch','waves'],['-','STREETScore','bars'],['-','Yield Finder','pct'],['-','Arbitrage Scanner','zap'],['-','Copy Trade','users'],null,['portfolio','Portfolio Intelligence','brief'],['-','CIO Insights','line']];
const LABEL = {home:'Home', pulse:'Pulse', guru:'Guru Talk', catalyst:'Catalyst', whale:'Whale Watch', admin:'Admin', alerts:'Admin · GOLDH Alerts', ciomoves:'Admin · CIO Moves', plansadmin:'Admin · Plans & Access', plans:'Compare Plans', portfolio:'Portfolio Intelligence'};
const isAdm = r => ['admin','alerts','ciomoves','plansadmin'].includes(r);
function renderNav(){
  const item = n => n[0]==='-' ? `<div class="ni dim" title="Not part of this prototype">${ic(n[2])}<span>${n[1]}</span></div>` : `<a class="ni ${S.route===n[0]?'on':''}" href="#${n[0]}">${ic(n[2])}<span>${n[1]}</span>${n[0]==='portfolio'&&!atLeast('pro')?`<span class="lk" title="Pro">${ic('lock')}</span>`:''}</a>`;
  $('#nav').innerHTML = `<div class="nsec">${item(NAV[0])}</div><div class="nsec"><h4>Features</h4>${NAV.slice(2,10).map(item).join('')}</div><div class="nsec"><h4>Intelligence Hub</h4>${NAV.slice(11).map(item).join('')}</div>`;
  $('#navfoot').innerHTML = `<a class="ni ${isAdm(S.route)?'on':''}" href="#admin">${ic('shield')}<span>Admin</span></a><div class="ni dim">${ic('book')}<span>Wiki</span></div><a class="ni ${S.route==='plans'?'on':''}" href="#plans">${ic('tag')}<span>Pricing</span></a><div class="ni dim">${ic('out')}<span>Sign out</span></div>`;
  $('#tabbar').innerHTML = [['home','Home','home'],['pulse','Pulse','activity'],['catalyst','Catalyst','zap'],['whale','Whale','waves'],['guru','Guru','msg'],['admin','Admin','shield']].map(([r,l,i])=>`<a href="#${r}" class="${S.route===r||(r==='admin'&&isAdm(S.route))?'on':''}">${ic(i)}<span>${l}</span></a>`).join('');
  $('#crumbs').innerHTML = S.route==='home' ? '<b>Intelligence</b>' : `<span>Home</span>${ic('chev').replace('<svg','<svg width="12" height="12"')}<b>${LABEL[S.route]}</b>`;
  $('#devstrip').textContent = S.env==='production' ? 'Production view · licence guard active · this prototype uses sample data' : 'Prototype · sample data, not market data · matches the current app design with the planned changes';
}
const VIEWS = {home, pulse, guru, catalyst, whale, admin, alerts, ciomoves:cioAdmin, plansadmin:plansAdmin, plans, portfolio};
function render(){
  const r = (location.hash||'#home').slice(1); S.route = VIEWS[r] ? r : 'home';
  renderNav(); $('#app').innerHTML = VIEWS[S.route](); renderBanner(); renderBell(); closeDrawer();
  if (S.route==='alerts') refreshComposer();
  if (S._lastPlan && S._lastPlan!==S.plan) $('#ntfs').innerHTML=''; S._lastPlan=S.plan;
  flushPops();
}
function confirmBox(text, yes){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="gl"><span class="lbl">Confirm change</span></div><p style="color:var(--g4);font-size:13px">${esc(text)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="mno">Cancel</button><button class="btn solid" id="myes">Confirm</button></div></div>`; document.body.appendChild(m); m.querySelector('#myes').focus(); m.querySelector('#mno').onclick=()=>m.remove(); m.querySelector('#myes').onclick=()=>{m.remove(); yes();}; }
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-ev],[data-go],a.tk'); if ($('#drawer') && !e.target.closest('#drawer') && !(b && b.dataset.bell)) closeDrawer(); if (!b) return; const d = b.dataset;
  if (d.popclose){ const el=document.querySelector(`[data-pid="${d.popclose}"]`); if (el) el.remove(); if (!d.go) return; }
  if (d.popset){ S.popups=d.popset; openDrawer(); toast(d.popset==='off'?'Pop-ups off: everything still arrives in the bell':d.popset==='critical'?'Pop-ups only for Critical alerts':'Pop-ups on'); return; }
  if (d.cioteaser){ S.cioSeen[d.cioteaser]=true; }
  if (d.cioopen){ const r=S.cio.find(x=>x.id==d.cioopen); if (!atLeast('pro')){ location.hash='plans'; return; } if (r.reach && !S.cioSeen[r.id]) r.reach.s++; const el=b.closest('.ntf'); if (el) el.remove(); cioModal(r); return; }
  if (d.pickplan){ S.plan=d.pickplan; $('#plan').value=S.plan; render(); toast('Prototype: plan switched to '+PN[S.plan]+'. In the app this happens after a confirmed payment.'); return; }
  if (d.previewas){ const from=S.route; S.plan=d.previewas; $('#plan').value=S.plan; if (from==='ciomoves' && !S.pop.some(n=>n.kind==='cio')){ const r=S.cio.slice().sort((a,b)=>b.t-a.t)[0]; if (r) enqueuePop({kind:'cio', r}); } location.hash='home'; $('#scroll').scrollTop=0; const who=(S.plan==='essential'||S.plan==='elite'?'an ':'a ')+PN[S.plan]+' subscriber'; setTimeout(()=>toast(from==='ciomoves' ? (S.plan==='free' ? `Viewing as ${who}: no pop-up; the bell shows a weekly line` : S.plan==='essential' ? `Viewing as ${who}: teaser pop-up without the ticker (bottom right)` : `Viewing as ${who}: the latest CIO move pops up bottom right`) : `Viewing as ${who}`), 450); return; }
  if (d.mxf){ S.mxf=d.mxf; render(); return; }
  if (d.cact){ S.cd.act=d.cact; const pos=openPos()[S.cd.tk.toUpperCase()]; S.cd.k = d.cact==='new'?1 : d.cact==='add'?Math.min(3,(pos?pos.k:0)+1) : d.cact==='trim'?Math.max(1,(pos?pos.k:2)-1) : 0; render(); return; }
  if (d.ck){ S.cd.k=Number(d.ck); render(); return; }
  if (d.creset){ S.cd=cioDraftNew(); render(); return; }
  if (d.cpub && !b.disabled){ const c=cioCalc(S.cd), tk=S.cd.tk.toUpperCase(); confirmBox(`${ACTL[S.cd.act]}: ${tk} ${S.cd.act==='close'?'(closed)':S.cd.k+' of 3'} at ${fmt(c.ref,c.ref>=1000?0:2)} USD. Goes to Portfolio Intelligence and to 484 Pro and Elite subscribers now. A published move cannot be edited, only followed by a new move.`, ()=>{
      const r={id:S.cio.length+100, act:S.cd.act, tk, name:c.pr.name, cls:S.cd.cls, k:S.cd.act==='close'?0:S.cd.k, ref:c.ref, t:NOW, src:S.cd.src, why:S.cd.why, disc:S.cd.disc, reach:{d:484,s:0}};
      S.cio.push(r); S.audit.unshift({t:NOW,who:'robin',what:`CIO move published: ${ACTL[r.act]} ${tk} ${r.act==='close'?'closed':r.k+' of 3'} @ ${fmt(r.ref,2)} · second admin check due in 30 min`}); enqueuePop({kind:'cio', r}); S.cd=cioDraftNew(); render(); toast('Published: Portfolio Intelligence updated, Pro and Elite notified'); }); return; }
  if (d.bell){ $('#drawer') ? closeDrawer() : (openDrawer()); return; }
  if (d.drclose){ closeDrawer(); return; }
  if (d.mclose){ const m=b.closest('.modal'); if (m) m.remove(); renderBanner(); renderBell(); return; }
  if (d.bcopen){ const a=S.bc.find(x=>x.id==d.bcopen); alertModal(a, false); renderBanner(); return; }
  if (d.bcclose){ rc(Number(d.bcclose)).dismissed=true; markSeen(S.bc.find(x=>x.id==d.bcclose)); renderBanner(); renderBell(); toast('Closed. The alert stays in the bell.'); return; }
  if (d.ack){ const a=S.bc.find(x=>x.id==d.ack); rc(a.id).ack=true; a.reach.a++; b.closest('.modal').remove(); renderBanner(); renderBell(); toast('Thank you. A short version stays pinned until the alert ends.'); setTimeout(loginCheck,300); return; }
  if (d.bcf){ S.bcf=d.bcf; render(); return; }
  if (d.focus){ const el = d.focus==='plans' ? document.querySelector('.plc input') : document.getElementById(d.focus); if (el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); } return; }
  if (d.dsev){ S.draft.sev=d.dsev; if (d.dsev==='critical' && S.draft.expH>72) S.draft.expH=24; render(); return; }
  if (d.dwhen){ S.draft.when=d.dwhen; render(); return; }
  if (d.pv){ S.pv=d.pv; document.querySelectorAll('[data-pv]').forEach(x=>x.classList.toggle('on',x.dataset.pv===S.pv)); refreshComposer(); return; }
  if (d.dreset){ S.draft={...newDraft(), title:'', body:'', know:'', dont:'', tickers:'', srcName:'', srcUrl:''}; render(); return; }
  if (d.dsave){ const o=fromDraft('draft'); S.audit.unshift({t:NOW,who:'robin',what:`Draft saved: "${o.title}"`}); render(); toast('Draft saved'); return; }
  if (d.pub && !b.disabled){ const o=fromDraft(S.draft.when==='later'?'scheduled':'awaiting'); if (o.status==='scheduled') o.approver='pending'; S.audit.unshift({t:NOW,who:'robin',what:`${o.status==='scheduled'?'Scheduled':'Sent for approval'}: "${o.title}" (${SEV[o.sev].l})`}); S.draft=newDraft(); S.bcf=o.status==='scheduled'?'scheduled':'awaiting'; render(); toast(o.status==='scheduled'?'Scheduled. A second admin approves before it goes out.':'Sent to Hardik and Krunal for approval'); return; }
  if (d.emerg && !b.disabled){ textModal('Emergency publish','Goes live now without a second approval. Write the reason; a second admin reviews it within 30 minutes.', why=>{ const o=fromDraft('awaiting'); publish(o,'Robin (emergency)',true); S.audit[0].what+=` · reason: ${why}`; S.draft=newDraft(); S.bcf='live'; render(); toast('Live: subscribers see it now'); }, 'Publish now'); return; }
  if (d.appr){ const a=S.bc.find(x=>x.id==d.appr); publish(a,'Krunal'); S.bcf='live'; render(); toast('Approved and live'); return; }
  if (d.pubnow){ const a=S.bc.find(x=>x.id==d.pubnow); publish(a,'Krunal'); S.bcf='live'; render(); toast('Live'); return; }
  if (d.rej){ const a=S.bc.find(x=>x.id==d.rej); a.status='draft'; S.audit.unshift({t:NOW,who:'krunal',what:`Sent back to draft: "${a.title}"`}); render(); return; }
  if (d.dup){ const a=S.bc.find(x=>x.id==d.dup); S.draft={...newDraft(), sev:a.sev, cat:a.cat, title:a.title, body:a.body, know:a.know, dont:a.dont, tickers:a.tickers.join(', '), srcName:a.src.name, srcUrl:a.src.url, plans:[...a.plans], follow:a.follow}; render(); $('#scroll').scrollTop=0; toast('Copied into the editor'); return; }
  if (d.upd){ const a=S.bc.find(x=>x.id==d.upd); textModal('Post update','Added under the original alert with the time. Subscribers who closed the banner see it again.', txt=>{ a.updates.push({t:NOW+60000,txt}); delete S.rc[a.id]; S.audit.unshift({t:NOW,who:'robin',what:`Update on "${a.title}"`}); render(); toast('Update posted'); }, 'Post update'); return; }
  if (d.wd){ const a=S.bc.find(x=>x.id==d.wd); textModal('Withdraw alert','The banner is removed now. The alert stays in subscribers\' bell marked Withdrawn, with this reason.', why=>{ a.status='withdrawn'; a.wdT=NOW+60000; a.wdWhy=why; S.audit.unshift({t:NOW,who:'robin',what:`Withdrawn: "${a.title}" · ${why}`}); render(); toast('Withdrawn'); }, 'Withdraw'); return; }
  if (d.viewas){ const a=S.bc.find(x=>x.id==d.viewas); S.plan = a.plans.includes('pro')?'pro':a.plans[0]; $('#plan').value=S.plan; if (a.follow && a.tickers[0] && !S.watchlist.includes(a.tickers[0])) S.watchlist.push(a.tickers[0]); delete S.rc[a.id];
    if (a.sev==='info') enqueuePop({kind:'alert', a});
    const who = (S.plan==='essential'||S.plan==='elite'?'an ':'a ')+PN[S.plan]+' subscriber';
    location.hash='home'; $('#scroll').scrollTop=0;
    setTimeout(() => { if (a.sev==='critical') loginCheck(); toast(a.sev==='info' ? `Viewing as ${who}: Info alerts arrive as a pop-up (bottom right) and in the bell` : a.sev==='important' ? `Viewing as ${who}: the alert is the banner at the top of every page` : `Viewing as ${who}: Critical opens at login, then stays pinned at the top`); const el = a.sev==='info' ? null : $('#bcast .bcb'); if (el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1600); } }, 450); return; }
  if (d.go){ location.hash = d.go; }
  else if (d.ptab){ S.ptab=d.ptab; render(); }
  else if (d.gtab){ S.gtab=d.gtab; render(); }
  else if (d.cf){ S.cfilter=d.cf; render(); }
  else if (d.lane){ S.lane=d.lane; render(); }
  else if (d.ev!==undefined){ const i=Number(d.ev); S.openEvent = S.openEvent===i?null:i; render(); }
  else if (d.unwatch){ S.watchlist=S.watchlist.filter(s=>s!==d.unwatch); render(); toast(d.unwatch+' removed from watchlist'); }
  else if (d.delalert){ S.alerts.splice(Number(d.delalert),1); render(); }
  else if (d.route && !b.disabled){ const from=S.routes[d.route], to=d.v; if (from===to) return; confirmBox(`${d.route}: ${VN[from]} → ${VN[to]}. Applies at the next job run and is written to the audit log.`, ()=>{ S.routes[d.route]=to; S.audit.unshift({t:NOW,who:'you',what:`${d.route}: ${VN[from]} → ${VN[to]}`}); render(); toast('Saved: sources and status update across all screens'); }); }
  else if (d.run){ const j=d.run; S.running[j]=true; render(); setTimeout(()=>{ delete S.running[j]; lastRun[j]=NOW+60000;
      if (j==='intradayBarsJob' && S.extraBars<17){ S.extraBars++; CH.forEach(c=>{ const r=mulberry(c.seed*7+S.extraBars); const l=c.today.at(-1); const cl=l.c*(1+(r()-.55)*.003); c.today.push({o:l.c,h:Math.max(l.c,cl)*1.0006,l:Math.min(l.c,cl)*.9994,c:cl,v:(.7+r())*1e6}); }); }
      const ty=(JOBS.find(x=>x[0]===j)||[])[1]; if (ty && vendorOf(ty)!=='mock') S.credits[vendorOf(ty)==='both'?'twelvedata':vendorOf(ty)].used += 4;
      S.audit.unshift({t:NOW,who:'you',what:`Run now: ${j} (ok)`}); render(); toast(j+' finished'+(j==='intradayBarsJob'?': a new bar is on the HOME charts':'')); }, 1100); }
  else if (d.dry){ S.audit.unshift({t:NOW,who:'you',what:`Dry run: ${d.dry} (validated, nothing written)`}); render(); toast('Dry run passed: fetched and validated, nothing written'); }
  else if (d.pause){ S.paused[d.pause]=!S.paused[d.pause]; S.audit.unshift({t:NOW,who:'you',what:`${S.paused[d.pause]?'Paused':'Resumed'}: ${d.pause}`}); render(); }
});
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.ev!==undefined){ e.preventDefault(); e.target.click(); } if (e.key==='Escape'){ const m=$('.modal'); if (m && !m.dataset.lock) m.remove(); else if (!m) closeDrawer(); } });
document.addEventListener('submit', e => { e.preventDefault();
  if (e.target.id==='wlform'){ const v=$('#wlin').value.trim().toUpperCase(); if (!v) return; if (S.watchlist.length>=lim('watchlist')){ toast(`Your ${PN[S.plan]} plan holds ${lim('watchlist')} symbols`); return; } if (!S.watchlist.includes(v)) S.watchlist.push(v); render(); toast(v+' added'); }
  if (e.target.id==='alform'){ const s=$('#als').value.trim().toUpperCase(), v=parseFloat($('#alv').value); if (!s||isNaN(v)){ toast('Enter a symbol and a price'); return; } S.alerts.push({s,op:$('#alop').value,v}); render(); toast('Alert saved: checked every 5 minutes, by email'); } });
document.addEventListener('input', e => { const cm = e.target.dataset && e.target.dataset.cm; if (cm && e.target.type!=='checkbox' && e.target.tagName!=='SELECT'){ S.cd[cm]=e.target.value; const id=e.target.id, pos=e.target.selectionStart, ph=e.target.placeholder; render(); const el = id ? document.getElementById(id) : [...document.querySelectorAll('[data-cm="'+cm+'"]')][0]; if (el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  const k=e.target.dataset && e.target.dataset.df; if (k && e.target.type!=='checkbox' && e.target.tagName!=='SELECT'){ S.draft[k]=e.target.value; refreshComposer(); } });
document.addEventListener('change', e => {
  if (e.target.dataset.cm && (e.target.type==='checkbox' || e.target.tagName==='SELECT')){ const k=e.target.dataset.cm; S.cd[k] = e.target.type==='checkbox' ? e.target.checked : e.target.value; render(); return; }
  if (e.target.dataset.df){ const k=e.target.dataset.df; S.draft[k] = e.target.type==='checkbox' ? e.target.checked : (k==='expH' ? Number(e.target.value) : e.target.value); if (e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='datetime-local') refreshComposer(); return; }
  if (e.target.dataset.dplan){ const k=e.target.dataset.dplan; S.draft.plans = e.target.checked ? [...new Set([...S.draft.plans,k])] : S.draft.plans.filter(x=>x!==k); e.target.closest('.plc').classList.toggle('on', e.target.checked); refreshComposer(); return; }
  if (e.target.id==='bcfile'){ S.draft.file = e.target.files[0] ? e.target.files[0].name : ''; render(); return; }
  if (e.target.id==='plan'){ S.plan=e.target.value; render(); }
  else if (e.target.id==='tz'){ S.tz=e.target.value; render(); }
  else if (e.target.id==='env'){ S.env=e.target.value; S.audit.unshift({t:NOW,who:'you',what:'Environment → '+S.env}); render(); }
  else if (e.target.dataset.prof){ S.profiles[e.target.dataset.prof]=e.target.value; S.audit.unshift({t:NOW,who:'you',what:`${VN[e.target.dataset.prof]} profile → ${e.target.value}`}); render(); } });
window.addEventListener('hashchange', () => { render(); $('#scroll').scrollTop = 0; });
render(); setTimeout(loginCheck, 400);
}
